<head>

<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">

<script>try{var t=localStorage.getItem('pl-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('pl-lang')==='en')document.documentElement.lang='en'}catch(e){}</script>
<link rel="stylesheet" href="css/ui.css">

<body class="site harga">

<script src="js/en.js"></script>
<script src="js/en-guide.js"></script>

<script src="js/harga.js"></script>
<script>
(function () {
  var P = PL, app = document.getElementById('app'), off = null;
  P.setView('site');
  function render() {
    if (off) off();
    document.title = P.T('Harga') + ' · Providea Loyalty';
    app.innerHTML = PLPrice.page() + P.footer();
    off = PLPrice.init(app);
  }
  P.onLang = function () { var y = scrollY; render(); scrollTo(0, y); };
  render();
  if (location.hash) { var el = document.getElementById(location.hash.slice(1)); if (el) setTimeout(function () { el.scrollIntoView(); }, 60); }
})();
</script>
</body>
