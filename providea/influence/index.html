    <script>
      /* Theme before first paint, so dark mode never flashes white. Mirrors store/session.theme. */
      try {
        var s = JSON.parse(localStorage.getItem('pi-demo') || 'null');
        var t = s && s.state && s.state.session && s.state.session.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
